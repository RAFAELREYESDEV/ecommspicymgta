<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="100%" height="100%">
  <defs>
    <!-- Natural Botanical Gelatin Shaders -->
    <linearGradient id="mW_GummyTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E25550"/>
      <stop offset="60%" stop-color="#C03542"/>
      <stop offset="100%" stop-color="#931A2D"/>
    </linearGradient>

    <linearGradient id="mW_GummyLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A51E32"/>
      <stop offset="50%" stop-color="#801222"/>
      <stop offset="100%" stop-color="#540813"/>
    </linearGradient>

    <linearGradient id="mW_GummyRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#72101D"/>
      <stop offset="60%" stop-color="#4B0710"/>
      <stop offset="100%" stop-color="#2D0207"/>
    </linearGradient>

    <linearGradient id="mW_DebossFloor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C03542"/>
      <stop offset="100%" stop-color="#72101D"/>
    </linearGradient>

    <filter id="mW_CubeShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#5C252D" flood-opacity="0.22"/>
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.12"/>
    </filter>

    <filter id="mW_DebossInner" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-1" dy="-1.5" stdDeviation="1" flood-color="#200307" flood-opacity="0.85"/>
      <feDropShadow dx="1" dy="1.5" stdDeviation="1" flood-color="#FFA8B8" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Background Base Light -->
  <rect width="640" height="380" fill="#FAF7F5" rx="20"/>
  <rect x="14" y="14" width="612" height="352" fill="none" stroke="#E6DDD7" stroke-width="1.2" rx="14"/>

  <!-- MASTER ICON: GUMMY CUBE WITH DEBOSSED +18 -->
  <g transform="translate(320, 138) scale(0.68)" filter="url(#mW_CubeShadow)">
    <ellipse cx="0" cy="135" rx="135" ry="24" fill="#693038" opacity="0.18"/>
    <ellipse cx="0" cy="133" rx="80" ry="12" fill="#540813" opacity="0.2"/>

    <!-- TOP FACE -->
    <path d="M -4 -2 
             C -42 -21, -85 -43, -118 -60
             C -126 -64, -126 -70, -118 -74
             C -85 -91, -42 -112, -4 -128
             C 4 -131, 8 -131, 14 -128
             C 48 -111, 90 -91, 120 -74
             C 127 -70, 127 -64, 118 -60
             C 88 -43, 46 -21, 6 -2
             C 3 0, -1 0, -4 -2 Z" 
          fill="url(#mW_GummyTop)"/>

    <path d="M -95 -64 
             C -65 -80, -28 -98, 0 -114 
             C 28 -98, 65 -80, 95 -64 
             C 60 -48, 25 -32, 0 -18 
             C -25 -32, -60 -48, -95 -64 Z" 
          fill="#FFFFFF" opacity="0.16"/>

    <path d="M -118 -74 C -85 -91, -42 -112, -4 -128 C 4 -131, 8 -131, 14 -128 C 48 -111, 90 -91, 120 -74" 
          fill="none" stroke="#FFBAC3" stroke-width="1.8" opacity="0.6"/>

    <!-- LEFT FACE -->
    <path d="M -122 -62 
             C -120 -15, -118 22, -116 58 
             C -115 65, -110 70, -102 75 
             C -70 93, -36 111, -4 128 
             C -1 130, 2 128, 2 122 
             C 1 82, 0 42, 0 0 
             C -38 -19, -82 -42, -122 -62 Z" 
          fill="url(#mW_GummyLeft)"/>

    <!-- RIGHT FACE -->
    <path d="M 0 0 
             C 0 42, -1 82, 0 122 
             C 1 128, 4 130, 8 128 
             C 40 111, 74 93, 104 75 
             C 112 70, 116 65, 116 58 
             C 118 22, 119 -15, 120 -60 
             C 82 -42, 40 -20, 0 0 Z" 
          fill="url(#mW_GummyRight)"/>

    <path d="M 0 2 C -0.5 42, -0.5 82, 0 122" fill="none" stroke="#FF8596" stroke-width="2.2" opacity="0.55"/>

    <!-- BOTANICAL TEXTURE -->
    <circle cx="-75" cy="12" r="1.5" fill="#E09F3E" opacity="0.85"/>
    <circle cx="-45" cy="85" r="1.8" fill="#FFFFFF" opacity="0.75"/>
    <circle cx="-85" cy="42" r="1.4" fill="#FFFFFF" opacity="0.65"/>
    <circle cx="-25" cy="105" r="1.6" fill="#E09F3E" opacity="0.75"/>
    <circle cx="-80" cy="-15" r="2" fill="#DDA15E" opacity="0.8"/>
    <circle cx="55" cy="22" r="1.5" fill="#FFFFFF" opacity="0.7"/>
    <circle cx="40" cy="72" r="1.8" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="75" cy="48" r="1.4" fill="#FFFFFF" opacity="0.65"/>
    <circle cx="32" cy="35" r="1.8" fill="#E09F3E" opacity="0.75"/>
    <circle cx="-42" cy="-62" r="1.6" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="42" cy="-66" r="1.6" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="0" cy="-70" r="1.8" fill="#FFFFFF" opacity="0.85"/>
    <circle cx="16" cy="-42" r="1.8" fill="#DDA15E" opacity="0.8"/>

    <!-- DEBOSSED +18 -->
    <g transform="translate(-54, 38) matrix(0.92, 0.48, 0, 1.05, 0, 0)">
      <g filter="url(#mW_DebossInner)">
        <path d="M -36 -5 L -26 -5 L -26 -15 L -18 -15 L -18 -5 L -8 -5 L -8 3 L -18 3 L -18 13 L -26 13 L -26 3 L -36 3 Z" 
              fill="url(#mW_DebossFloor)"/>
        <path d="M -2 -3 L 6 -14 L 15 -14 L 15 13 L 6 13 L 6 -3 Z" 
              fill="url(#mW_DebossFloor)"/>
        <path d="M 33 -14 
                 C 44 -14, 52 -7, 52 -2 
                 C 52 3, 47 7, 43 9 
                 C 49 11, 54 16, 54 22 
                 C 54 30, 45 35, 33 35 
                 C 22 35, 13 30, 13 22 
                 C 13 16, 17 11, 23 9 
                 C 19 7, 14 3, 14 -2 
                 C 14 -7, 22 -14, 33 -14 Z 
                 M 33 -7 
                 C 26 -7, 22 -4, 22 -1 
                 C 22 2, 26 5, 33 5 
                 C 40 5, 44 2, 44 -1 
                 C 44 -4, 40 -7, 33 -7 Z 
                 M 33 13 
                 C 25 13, 21 16, 21 21 
                 C 21 26, 25 29, 33 29 
                 C 41 29, 45 26, 45 21 
                 C 45 16, 41 13, 33 13 Z" 
              fill="url(#mW_DebossFloor)" 
              transform="scale(0.85) translate(8, -8)"/>
      </g>
      <path d="M -36 4 L -26 4 L -26 14 L -17 14 L -17 4 L -7 4" 
            fill="none" stroke="#FFBAC3" stroke-width="1" opacity="0.7"/>
      <path d="M 5 14 L 16 14" 
            fill="none" stroke="#FFBAC3" stroke-width="1" opacity="0.7"/>
      <path d="M 20 22 C 20 28, 25 32, 35 32 C 44 32, 48 28, 48 22" 
            fill="none" stroke="#FFBAC3" stroke-width="1" opacity="0.65" transform="scale(0.85) translate(8, -8)"/>
    </g>
  </g>

  <!-- MASTER LOGOTYPE: SPICY (LIGHT) -->
  <g transform="translate(320, 292)" text-anchor="middle">
    <text font-family="'Helvetica Neue', -apple-system, 'SF Pro Display', 'Arial', sans-serif" 
          font-size="48" 
          font-weight="900" 
          letter-spacing="20" 
          fill="#1C0D12" 
          x="10">SPICY</text>
    
    <path d="M 0 20 L 4 24 L 0 28 L -4 24 Z" fill="#B83B46"/>

    <text font-family="'Helvetica Neue', -apple-system, 'SF Pro Text', 'Arial', sans-serif" 
          font-size="9.5" 
          font-weight="700" 
          letter-spacing="6" 
          fill="#8A4A58" 
          y="42" 
          x="3">BOCADOS BOTÁNICOS SENSORIALES</text>
  </g>
</svg>