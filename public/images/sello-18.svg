<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 160" width="100%" height="100%">
  <defs>
    <radialGradient id="spicySealBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1B1216"/>
      <stop offset="65%" stop-color="#0F090C"/>
      <stop offset="100%" stop-color="#080406"/>
    </radialGradient>
    <filter id="spicySealGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#C03542" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <rect width="500" height="160" fill="url(#spicySealBg)" rx="20"/>
  <rect x="15" y="15" width="470" height="130" fill="none" stroke="#2B1A22" stroke-width="1.2" rx="16"/>

  <g transform="translate(250, 80)" filter="url(#spicySealGlow)">
    <rect x="-180" y="-30" width="360" height="60" rx="30" fill="#14080D" stroke="#C03542" stroke-width="2"/>
    <rect x="-172" y="-22" width="344" height="44" rx="22" fill="#1E0B12" opacity="0.75"/>
    
    <!-- Status indicator pip -->
    <circle cx="-135" cy="0" r="6" fill="#C03542" opacity="0.35"/>
    <circle cx="-135" cy="0" r="4.2" fill="#C03542"/>
    <circle cx="-135" cy="0" r="2" fill="#FFFFFF"/>

    <text x="14" y="6" 
          text-anchor="middle" 
          font-family="'Helvetica Neue', -apple-system, 'SF Pro Text', 'Arial', sans-serif" 
          font-size="14" 
          font-weight="800" 
          letter-spacing="4" 
          fill="#FFFFFF">
      DATE NIGHT • BOTANICAL
    </text>
  </g>
</svg>