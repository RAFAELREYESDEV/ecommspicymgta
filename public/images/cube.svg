<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Shaders & Gradients for Gummy Translucency -->
    <linearGradient id="topJellyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D6D"/>
      <stop offset="45%" stop-color="#E01137"/>
      <stop offset="100%" stop-color="#99001A"/>
    </linearGradient>

    <linearGradient id="leftFaceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C9184A"/>
      <stop offset="70%" stop-color="#800F2F"/>
      <stop offset="100%" stop-color="#4A0518"/>
    </linearGradient>

    <linearGradient id="rightFaceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#800F2F"/>
      <stop offset="70%" stop-color="#590D22"/>
      <stop offset="100%" stop-color="#2B050E"/>
    </linearGradient>

    <!-- Chili Pepper Gradients -->
    <linearGradient id="chiliBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF385C"/>
      <stop offset="40%" stop-color="#E01137"/>
      <stop offset="85%" stop-color="#800010"/>
      <stop offset="100%" stop-color="#4A0008"/>
    </linearGradient>

    <linearGradient id="stemGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38B000"/>
      <stop offset="70%" stop-color="#70E000"/>
      <stop offset="100%" stop-color="#9EF01A"/>
    </linearGradient>

    <!-- Puffy Letter Gradients (Pop Art 3D Tubes) -->
    <linearGradient id="letterSpicyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF758F"/>
      <stop offset="30%" stop-color="#FF4D6D"/>
      <stop offset="75%" stop-color="#C9184A"/>
      <stop offset="100%" stop-color="#590D22"/>
    </linearGradient>

    <linearGradient id="letterCubesGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C9184A"/>
      <stop offset="40%" stop-color="#A4133C"/>
      <stop offset="80%" stop-color="#590D22"/>
      <stop offset="100%" stop-color="#2B050E"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="cubeDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="20" flood-color="#000000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#E01137" flood-opacity="0.35"/>
    </filter>

    <filter id="chiliShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#330005" flood-opacity="0.6"/>
    </filter>

    <radialGradient id="vignetteDark" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#1A0D12"/>
      <stop offset="60%" stop-color="#0E060A"/>
      <stop offset="100%" stop-color="#050204"/>
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="600" fill="url(#vignetteDark)" rx="24"/>
  <rect x="18" y="18" width="564" height="564" fill="none" stroke="#2B141E" stroke-width="1.2" rx="18"/>

  <!-- ======================================================== -->
  <!-- ISOMETRIC 3D TYPOGRAPHIC CUBE: SPICY CUBES               -->
  <!-- ======================================================== -->
  <g transform="translate(300, 275)" filter="url(#cubeDropShadow)">

    <!-- Cast Ground Shadow -->
    <ellipse cx="0" cy="195" rx="190" ry="34" fill="#000000" opacity="0.75"/>
    <ellipse cx="0" cy="192" rx="110" ry="18" fill="#590D22" opacity="0.4"/>

    <!-- 1. LEFT ISOMETRIC FACE (SPICY) -->
    <path d="M 0 45 L -165 -50 L -165 140 L 0 235 Z" fill="url(#leftFaceGrad)"/>

    <!-- 2. RIGHT ISOMETRIC FACE (CUBES) -->
    <path d="M 0 45 L 165 -50 L 165 140 L 0 235 Z" fill="url(#rightFaceGrad)"/>

    <!-- 3. TOP ISOMETRIC JELLY FACE -->
    <path d="M 0 -145 L 165 -50 L 0 45 L -165 -50 Z" fill="url(#topJellyGrad)"/>
    <!-- Top Face Gelatin Specular Sheen -->
    <path d="M -135 -50 L 0 -128 L 135 -50 L 0 28 Z" fill="#FFFFFF" opacity="0.16"/>
    <path d="M -165 -50 L 0 -145 L 165 -50" fill="none" stroke="#FFB3C1" stroke-width="2" opacity="0.5"/>

    <!-- 4. PUFFY 3D TYPOGRAPHY ON LEFT FACE: SPICY -->
    <!-- Sheared along isometric angle +30° -->
    <g transform="translate(-82, 95) matrix(0.866, 0.5, 0, 1, 0, 0)">
      <text font-family="'Arial Black', 'Montserrat', -apple-system, sans-serif" 
            font-size="44" 
            font-weight="900" 
            letter-spacing="5" 
            fill="url(#letterSpicyGrad)" 
            stroke="#2B050E" 
            stroke-width="5" 
            paint-order="stroke fill" 
            text-anchor="middle" 
            x="0" y="14">
        SPICY
      </text>
      <!-- Tube Highlight -->
      <text font-family="'Arial Black', 'Montserrat', -apple-system, sans-serif" 
            font-size="44" 
            font-weight="900" 
            letter-spacing="5" 
            fill="none" 
            stroke="#FFCCD5" 
            stroke-width="1.2" 
            stroke-dasharray="8 6" 
            text-anchor="middle" 
            x="0" y="13">
        SPICY
      </text>
    </g>

    <!-- 5. PUFFY 3D TYPOGRAPHY ON RIGHT FACE: CUBES -->
    <!-- Sheared along isometric angle -30° -->
    <g transform="translate(82, 95) matrix(0.866, -0.5, 0, 1, 0, 0)">
      <text font-family="'Arial Black', 'Montserrat', -apple-system, sans-serif" 
            font-size="44" 
            font-weight="900" 
            letter-spacing="5" 
            fill="url(#letterCubesGrad)" 
            stroke="#1A0206" 
            stroke-width="5" 
            paint-order="stroke fill" 
            text-anchor="middle" 
            x="0" y="14">
        CUBES
      </text>
      <!-- Tube Highlight -->
      <text font-family="'Arial Black', 'Montserrat', -apple-system, sans-serif" 
            font-size="44" 
            font-weight="900" 
            letter-spacing="5" 
            fill="none" 
            stroke="#FF8FA3" 
            stroke-width="1.2" 
            stroke-dasharray="8 6" 
            text-anchor="middle" 
            x="0" y="13">
        CUBES
      </text>
    </g>

    <!-- 6. DEBOSSED BASE FOOTER: +18 DATE NIGHT -->
    <g transform="translate(-75, 208) matrix(0.866, 0.5, 0, 1, 0, 0)">
      <text font-family="'Montserrat', sans-serif" font-size="10" font-weight="900" letter-spacing="3" fill="#FF758F" opacity="0.85" text-anchor="middle">
        +18 DATE NIGHT
      </text>
    </g>
    <g transform="translate(75, 208) matrix(0.866, -0.5, 0, 1, 0, 0)">
      <text font-family="'Montserrat', sans-serif" font-size="10" font-weight="900" letter-spacing="3" fill="#C9184A" opacity="0.85" text-anchor="middle">
        BOTANICAL EDIBLE
      </text>
    </g>

    <!-- 7. THE TOPPING: GLOSSY SUCCULENT RED CHILI PEPPER -->
    <g transform="translate(0, -65)" filter="url(#chiliShadow)">
      <!-- Chili Pod Body -->
      <path d="M -85 5 
               C -45 -35, 45 -40, 95 -10 
               C 108 -2, 102 18, 85 24 
               C 45 38, -35 32, -85 5 Z" 
            fill="url(#chiliBodyGrad)"/>
      
      <!-- Volumetric Gloss Highlights -->
      <path d="M -65 2 
               C -35 -22, 35 -25, 75 -5 
               C 50 -15, -15 -12, -65 2 Z" 
            fill="#FFFFFF" opacity="0.65"/>
      <circle cx="58" cy="10" r="3.5" fill="#FFFFFF" opacity="0.75"/>
      <circle cx="70" cy="14" r="2" fill="#FFFFFF" opacity="0.6"/>

      <!-- Chili Calyx / Crown -->
      <path d="M 85 -5 
               C 92 -12, 105 -10, 108 -2 
               C 106 10, 95 18, 88 12 
               Z" 
            fill="#38B000"/>
      <path d="M 88 -3 L 95 -8 L 92 0 L 102 2 L 95 6 Z" fill="#70E000"/>

      <!-- Elegant Curved Green Stem -->
      <path d="M 102 -2 
               C 118 -15, 128 -38, 122 -55 
               C 120 -60, 114 -62, 112 -58 
               C 110 -54, 115 -42, 106 -30 
               C 100 -22, 96 -15, 98 -4 Z" 
            fill="url(#stemGrad)"/>
    </g>

  </g>
</svg>